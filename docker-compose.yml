services:
  postgres:
    image: postgres:16-alpine
    container_name: hosteldesk-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: Luba
    ports:
      - "5432:5432"
    volumes:
      - hosteldesk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Luba"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  hosteldesk_pgdata:
